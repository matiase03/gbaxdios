name: Descomprimir zip dividido

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unir las partes
        run: zip -s 0 todo.zip --out unido.zip

      - name: Descomprimir en la raíz
        run: unzip -o unido.zip -d .

      - name: Borrar zips
        run: rm -f unido.zip todo.zip todo.z[0-9][0-9]

      - name: Commit de los archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir todo.zip dividido" || echo "Sin cambios"
          git push
