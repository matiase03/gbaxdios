name: Descomprimir Falta.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir Falta.zip
        run: |
          cd tools
          unzip -o Falta.zip
          rm Falta.zip
          ls -la

      - name: Commit del resultado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir Falta.zip" || echo "Nada para commitear"
          git push
