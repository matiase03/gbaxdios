name: Descomprimir Falta.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver contenido del zip
        run: |
          cd tools
          unzip -l Falta.zip

      - name: Descomprimir
        run: |
          cd tools
          unzip -o Falta.zip
          ls -la

      - name: Ver qué detecta git
        run: |
          git status --short | head -50
          echo "--- ignorados ---"
          git status --short --ignored | grep '^!!' | head -50

      - name: Commit del resultado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -f
          git reset -q tools/Falta.zip
          git commit -m "Descomprimir Falta.zip" || echo "Nada para commitear"
          git push
