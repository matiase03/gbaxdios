name: Build GBA ROM & ArkOS R36S Port

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev build-essential gcc-aarch64-linux-gnu
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
          sudo mkdir -p /opt/arm-toolchain
          sudo tar -xf arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz -C /opt/arm-toolchain --strip-components=1
          echo "/opt/arm-toolchain/bin" >> $GITHUB_PATH
          arm-none-eabi-gcc --version || /opt/arm-toolchain/bin/arm-none-eabi-gcc --version

      - name: Build GBA ROM
        run: |
          make -j$(nproc)

      - name: Prepare ArkOS Port Package
        run: |
          cp pokeemerald.gba "ports/pokeemerald-arg/pokeemerald-argentina.gba"
          cd ports && zip -r ../Pokemon_Argentina_R36S.zip .

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Argentina_GBA
          path: pokeemerald.gba

      - name: Upload R36S ArkOS Package
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Argentina_R36S_Ports
          path: Pokemon_Argentina_R36S.zip
